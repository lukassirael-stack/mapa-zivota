<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Mapa života</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy-deep:#0a0f24;--navy:#0d1430;--gold:#d4af6a;--gold-bright:#f0d9a0;
    --text:#e8e6df;--text-soft:#9a978c;--ok:#7fc78a;--warn:#e0b45c;--err:#e07a7a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(180deg,var(--navy-deep),var(--navy));color:var(--text);
    font-family:'Jost',sans-serif;font-weight:300;font-size:15px;min-height:100vh;padding:34px 20px 80px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-family:'Cinzel',serif;font-weight:500;color:var(--gold-bright);font-size:26px;margin-bottom:24px}
  h1 small{font-family:'Jost';font-size:13px;color:var(--text-soft);letter-spacing:.1em;margin-left:12px}
  .login{max-width:340px;margin:12vh auto;text-align:center}
  input[type=password]{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,106,.3);
    color:var(--text);padding:12px 14px;border-radius:8px;font-size:16px;outline:none;margin-bottom:14px}
  button{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#241a05;border:none;
    padding:10px 18px;border-radius:8px;font-family:'Jost';font-weight:500;font-size:13px;cursor:pointer;letter-spacing:.05em}
  button:disabled{opacity:.45;cursor:default}
  button.sec{background:transparent;border:1px solid rgba(212,175,106,.45);color:var(--gold)}
  table{width:100%;border-collapse:collapse;margin-top:14px}
  th{font-weight:500;text-align:left;color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    padding:10px 10px;border-bottom:1px solid rgba(212,175,106,.35)}
  td{padding:10px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top}
  tr:hover td{background:rgba(255,255,255,.025)}
  .st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;letter-spacing:.04em}
  .st.sent{background:rgba(127,199,138,.14);color:var(--ok)}
  .st.generated{background:rgba(224,180,92,.14);color:var(--warn)}
  .st.paid,.st.created{background:rgba(140,160,220,.14);color:#a9bce8}
  .st.error{background:rgba(224,122,122,.15);color:var(--err)}
  .mail{color:var(--text-soft);font-size:13px}
  .err-det{color:var(--err);font-size:12px;max-width:260px;word-break:break-word}
  .cas{color:var(--text-soft);font-size:12px;white-space:nowrap}
  .akce{white-space:nowrap}
  .akce button{margin-right:6px;padding:6px 12px;font-size:12px}
  #info{margin:12px 0;color:var(--text-soft)}
  .hide{display:none}
  a.mapalink{color:var(--gold);text-decoration:none;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="login" id="login">
    <h1 style="justify-content:center">Mapa života <small>ADMIN</small></h1>
    <input type="password" id="heslo" placeholder="Heslo">
    <button id="prihlasit">Vstoupit</button>
    <p id="loginErr" style="color:var(--err);margin-top:10px"></p>
  </div>

  <div id="panel" class="hide">
    <h1>Mapa života <small>ADMIN · OÁZA ADAMANTHEA</small></h1>
    <div>
      <button class="sec" id="obnovit">↻ Obnovit</button>
      <span id="info"></span>
    </div>
    <table>
      <thead><tr><th>Vytvořeno</th><th>Jméno / e-mail</th><th>Kód</th><th>Stav</th><th>Odesláno</th><th>Zobrazeno</th><th>Akce</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const $=(id)=>document.getElementById(id);
let HESLO=sessionStorage.getItem('mz_heslo')||'';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cas(t){if(!t)return '—';const d=new Date(t);return d.toLocaleDateString('cs-CZ')+' '+d.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});}

async function api(method, body){
  const r=await fetch('/api/admin'+(method==='GET'?'?akce=list':''),{
    method, headers:{'Content-Type':'application/json','x-admin-heslo':HESLO},
    body: method==='POST'?JSON.stringify(body):undefined
  });
  if(r.status===401) throw new Error('auth');
  return r.json();
}

async function nacti(){
  $('info').textContent='Načítám…';
  try{
    const d=await api('GET');
    const rows=d.mapy||[];
    $('info').textContent=rows.length+' map · odeslaných '+rows.filter(x=>x.status==='sent').length;
    $('tbody').innerHTML=rows.map(m=>`
      <tr>
        <td class="cas">${cas(m.created_at)}</td>
        <td>${esc(m.name||'—')}<br><span class="mail">${esc(m.email||'')}</span></td>
        <td>${esc(m.code)}</td>
        <td><span class="st ${esc(m.status)}">${esc(m.status)}</span>
            ${m.error_detail?`<div class="err-det">${esc(m.error_detail)}</div>`:''}</td>
        <td class="cas">${cas(m.sent_at)}</td>
        <td class="cas">${m.viewed_at?cas(m.viewed_at):'—'}</td>
        <td class="akce">
          <button data-akce="regenerovat" data-id="${m.id}">⟳ Vygenerovat</button>
          <button class="sec" data-akce="poslat" data-id="${m.id}" ${!m.generated_at?'disabled':''}>✉ Poslat znovu</button>
          ${['generated','sent'].includes(m.status)?`<a class="mapalink" href="/mapa?m=${m.id}" target="_blank">otevřít ↗</a>`:''}
        </td>
      </tr>`).join('') || '<tr><td colspan="7" style="color:var(--text-soft)">Zatím žádné mapy.</td></tr>';
  }catch(e){
    if(e.message==='auth'){ odhlasit('Špatné heslo.'); return; }
    $('info').textContent='Nepodařilo se načíst.';
  }
}

document.addEventListener('click', async (ev)=>{
  const b=ev.target.closest('button[data-akce]'); if(!b) return;
  const {akce,id}=b.dataset;
  if(akce==='regenerovat' && !confirm('Vygenerovat mapu znovu a poslat e-mail? (Stávající obsah se přepíše.)')) return;
  b.disabled=true; b.textContent=akce==='regenerovat'?'Generuji… (až 2 min)':'Posílám…';
  try{
    const r=await api('POST',{akce,id});
    if(r.error) alert('Chyba: '+(r.detail||r.error));
  }catch(e){ alert('Chyba spojení / hesla.'); }
  nacti();
});

function odhlasit(msg){ sessionStorage.removeItem('mz_heslo'); HESLO='';
  $('panel').classList.add('hide'); $('login').classList.remove('hide'); $('loginErr').textContent=msg||''; }

$('prihlasit').addEventListener('click', async ()=>{
  HESLO=$('heslo').value; sessionStorage.setItem('mz_heslo',HESLO);
  $('loginErr').textContent='';
  try{ await api('GET'); $('login').classList.add('hide'); $('panel').classList.remove('hide'); nacti(); }
  catch(e){ odhlasit('Špatné heslo.'); }
});
$('heslo').addEventListener('keydown',e=>{if(e.key==='Enter')$('prihlasit').click();});
$('obnovit').addEventListener('click',nacti);

if(HESLO){ (async()=>{ try{ await api('GET'); $('login').classList.add('hide'); $('panel').classList.remove('hide'); nacti(); }catch(e){ odhlasit(); } })(); }
</script>
</body>
</html>
