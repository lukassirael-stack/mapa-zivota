<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tvá Mapa života — Oáza Adamanthea</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{--navy-deep:#070b1c;--navy:#0d1430;--navy-soft:#141d44;--gold:#d4af6a;--gold-bright:#f0d9a0;
    --gold-dim:#9c8049;--text:#e8e6df;--text-soft:#b9b6ab;--panel-border:rgba(212,175,106,.22)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(1200px 700px at 75% -10%,rgba(40,56,120,.55),transparent 60%),
    linear-gradient(180deg,var(--navy-deep),var(--navy) 55%,#060916);
    color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;font-size:19.5px;line-height:1.75;
    min-height:100vh;overflow-x:hidden;position:relative}
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:.7;animation:tw 3.5s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:70px 26px 110px}
  .head{text-align:center;margin-bottom:38px}
  .kicker{font-family:'Cinzel',serif;letter-spacing:.42em;font-size:12px;color:var(--gold);margin-bottom:12px}
  h1{font-family:'Cinzel',serif;font-weight:500;font-size:clamp(32px,5.6vw,48px);color:var(--gold-bright)}
  .sub{font-style:italic;color:var(--text-soft);margin-top:6px}
  .card{border:1px solid var(--gold);border-radius:12px;background:rgba(20,29,68,.55);padding:24px 26px;
    margin:34px auto;max-width:520px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  .row{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px dashed rgba(212,175,106,.18)}
  .row:last-child{border-bottom:none}
  .lbl{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;color:var(--text-soft);padding-top:5px}
  .val{color:var(--gold-bright);text-align:right}
  #obsah h2{font-family:'Cinzel',serif;font-weight:500;color:var(--gold);font-size:27px;margin:44px 0 6px;
    padding-bottom:10px;border-bottom:1px solid rgba(212,175,106,.35)}
  #obsah h3{font-family:'Cinzel',serif;font-weight:500;color:var(--gold-bright);font-size:20px;margin:26px 0 4px}
  #obsah p{margin:14px 0;text-align:justify}
  #obsah ul{margin:14px 0 14px 6px;list-style:none}
  #obsah li{position:relative;padding-left:28px;margin:9px 0;text-align:justify}
  #obsah li::before{content:"✦";position:absolute;left:2px;color:var(--gold);font-size:14px;top:4px}
  #obsah strong{color:var(--gold-bright);font-weight:600}
  #obsah em{color:var(--text-soft)}
  .loading{text-align:center;color:var(--text-soft);font-style:italic;padding:60px 0}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--gold-dim);border-top-color:var(--gold-bright);
    border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pdfnote{text-align:center;margin-top:56px;padding-top:26px;border-top:1px solid rgba(212,175,106,.2);
    color:var(--text-soft);font-size:16.5px}
  .pdfnote a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
  <div class="head">
    <div class="kicker">OÁZA ADAMANTHEA</div>
    <h1>Mapa života</h1>
    <div class="sub" id="sub">osobní průvodce cykly tvé duše</div>
  </div>
  <div class="card" id="profil" style="display:none"></div>
  <div class="loading" id="loading"><span class="spin"></span>Otevírám tvou mapu…</div>
  <div id="obsah"></div>
  <div class="pdfnote" id="pdfnote" style="display:none">
    Tato mapa ti dorazila i <strong>e-mailem s PDF</strong> — ulož si ji a vracej se k ní.<br>
    S láskou, <a href="https://oaza-adamanthea.cz">Oáza Adamanthea</a>
  </div>
</div>

<script>
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<130;i++){const s=document.createElement('div');s.className='star';
    const size=Math.random()<.85?1.5:2.5;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${(Math.random()*3.5).toFixed(2)}s`;
    c.appendChild(s);}
})();

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* markdown renderer — 1:1 logika z prototypu */
function renderMarkdown(md){
  const lines=String(md).split('\n'); let html=''; let inList=false;
  const inl=(t)=>esc(t)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  for(const raw of lines){
    const line=raw.trimEnd();
    if(!line.trim()){ if(inList){html+='</ul>';inList=false;} continue; }
    if(line.startsWith('## ')){ if(inList){html+='</ul>';inList=false;} html+='<h2>'+inl(line.slice(3))+'</h2>'; }
    else if(line.startsWith('### ')){ if(inList){html+='</ul>';inList=false;} html+='<h3>'+inl(line.slice(4))+'</h3>'; }
    else if(/^[-*•]\s+/.test(line)){ if(!inList){html+='<ul>';inList=true;} html+='<li>'+inl(line.replace(/^[-*•]\s+/,''))+'</li>'; }
    else { if(inList){html+='</ul>';inList=false;} html+='<p>'+inl(line)+'</p>'; }
  }
  if(inList)html+='</ul>';
  return html;
}

async function nacti(){
  const m=new URLSearchParams(location.search).get('m');
  const loading=document.getElementById('loading');
  if(!m){ loading.textContent='Chybí odkaz na mapu — použij prosím odkaz z e-mailu.'; return; }
  try{
    const r=await fetch('/api/mapa?m='+encodeURIComponent(m));
    const d=await r.json();
    if(!r.ok){ loading.textContent='Mapu jsme nenašli — zkontroluj prosím odkaz z e-mailu.'; return; }
    if(!d.obsah){
      loading.innerHTML='<span class="spin"></span>Tvá mapa se ještě tká — zkus to za chvilku, nebo počkej na e-mail.';
      setTimeout(nacti, 8000); return;
    }
    document.getElementById('sub').textContent='pro '+d.name;
    const p=d.profil||{};
    const rows=[['HVĚZDNÝ ROD', d.starLineage],['SLUNCE',p.sun],p.ascendant?['ASCENDENT',p.ascendant]:null,
      ['ČÍSLO ŽIVOTNÍ CESTY',p.lifePath]].filter(Boolean);
    const karta=document.getElementById('profil');
    karta.innerHTML=rows.map(r=>`<div class="row"><div class="lbl">${esc(r[0])}</div><div class="val">${esc(r[1])}</div></div>`).join('');
    karta.style.display='block';
    document.getElementById('obsah').innerHTML=renderMarkdown(d.obsah);
    document.getElementById('pdfnote').style.display='block';
    loading.style.display='none';
  }catch(e){ loading.textContent='Něco se nepovedlo — zkus obnovit stránku.'; }
}
nacti();
</script>
</body>
</html>
