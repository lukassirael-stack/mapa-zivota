<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Děkujeme — Mapa života</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{--navy-deep:#070b1c;--navy:#0d1430;--gold:#d4af6a;--gold-bright:#f0d9a0;--gold-dim:#9c8049;
    --text:#e8e6df;--text-soft:#b9b6ab}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(1100px 650px at 70% -10%,rgba(40,56,120,.5),transparent 60%),
    linear-gradient(180deg,var(--navy-deep),var(--navy) 55%,#060916);
    color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.7;
    min-height:100vh;overflow-x:hidden;position:relative}
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:.7;animation:tw 3.5s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
  .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:88px 24px 96px;text-align:center}
  .kicker{font-family:'Cinzel',serif;letter-spacing:.42em;font-size:12px;color:var(--gold);margin-bottom:14px}
  h1{font-family:'Cinzel',serif;font-weight:500;font-size:clamp(30px,5.4vw,44px);color:var(--gold-bright);margin-bottom:22px}
  p{color:var(--text-soft);max-width:520px;margin:0 auto 16px}
  .stavbox{margin:36px auto 26px;padding:26px 28px;max-width:480px;border:1px solid rgba(212,175,106,.28);
    border-radius:12px;background:rgba(20,29,68,.5)}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--gold-dim);border-top-color:var(--gold-bright);
    border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .stav{color:var(--gold-bright);font-style:italic;font-size:20px}
  a.cta{display:none;font-family:'Cinzel',serif;letter-spacing:.14em;font-size:16px;text-decoration:none;
    color:#241a05;background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    padding:17px 32px;border-radius:999px;box-shadow:0 14px 38px rgba(212,175,106,.32);margin-top:8px}
  a.cta.on{display:inline-block}
  .note{font-size:16px;margin-top:22px}
  .foot{margin-top:56px;color:var(--text-soft);font-size:15px}
  .foot a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
  <div class="kicker">OÁZA ADAMANTHEA</div>
  <h1>Děkujeme ✦</h1>
  <p>Tvá platba dorazila v pořádku.</p>

  <div class="stavbox">
    <div class="stav" id="stav"><span class="spin"></span>Tvá Mapa života se právě tká…</div>
  </div>

  <a class="cta" id="zobrazit" href="#">✦ Zobrazit mou Mapu života</a>

  <p class="note" id="note">Obvykle to trvá jen pár minut. Hotová mapa ti zároveň přijde
    <strong>e-mailem i s PDF</strong> — takže tu nemusíš čekat.</p>

  <div class="foot">Kdyby cokoliv — <a href="mailto:oaza.adamanthea@gmail.com">oaza.adamanthea@gmail.com</a></div>
</div>

<script>
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<110;i++){const s=document.createElement('div');s.className='star';
    const size=Math.random()<.85?1.5:2.5;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${(Math.random()*3.5).toFixed(2)}s`;
    c.appendChild(s);}
})();

const m=new URLSearchParams(location.search).get('m');
const stavEl=document.getElementById('stav'), btn=document.getElementById('zobrazit'), note=document.getElementById('note');

async function check(){
  if(!m) return;
  try{
    const r=await fetch('/api/mapa?m='+encodeURIComponent(m));
    const d=await r.json();
    if(['generated','sent'].includes(d.status)){
      stavEl.innerHTML='✨ Tvá Mapa života je hotová.';
      btn.href='/mapa?m='+encodeURIComponent(m);
      btn.classList.add('on');
      note.innerHTML='Zároveň ti dorazila <strong>e-mailem i s PDF</strong> — najdeš ji tam kdykoli.';
      return;
    }
    if(d.status==='error'){
      stavEl.innerHTML='Tkaní se na chvíli zadrhlo — už o tom víme a mapu ti dokončíme ručně. Přijde ti e-mailem.';
      return;
    }
  }catch(e){}
  setTimeout(check, 8000);
}
check();
</script>
</body>
</html>
